services:
  meshcore-monitor:
    build: .
    container_name: meshcore-monitor
    restart: unless-stopped
    env_file:
      - .env
    devices:
      - "${SERIAL_PORT:-/dev/ttyUSB0}:${SERIAL_PORT:-/dev/ttyUSB0}"
    volumes:
      - ./known_nodes.json:/app/known_nodes.json
    environment:
      KNOWN_NODES_FILE: /app/known_nodes.json
      RUST_BACKTRACE: "1"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
