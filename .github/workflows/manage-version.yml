name: Manage application version

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  version:
    # Do not grant write access to branches from forked repositories.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Calculate expected version
        id: expected
        env:
          CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: |
          set -euo pipefail
          expected="$(TZ=America/Sao_Paulo date -d "$CREATED_AT" '+%Y%m%d.%H%M%S')"
          printf 'value=%s\n' "$expected" >> "$GITHUB_OUTPUT"

      - name: Update version on a new pull request
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.value }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          printf '%s\n' "$EXPECTED_VERSION" > VERSION

          if git diff --quiet -- VERSION; then
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERSION
          git commit -m "chore: atualiza versao do PR #$PR_NUMBER [skip ci]"
          git push origin "HEAD:$HEAD_REF"

      - name: Validate version
        env:
          EXPECTED_VERSION: ${{ steps.expected.outputs.value }}
        run: |
          set -euo pipefail
          actual="$(tr -d '\r\n' < VERSION)"

          if [[ ! "$actual" =~ ^[0-9]{8}\.[0-9]{6}$ ]]; then
            echo "VERSION fora do formato YYYYmmDD.HHMMss: $actual" >&2
            exit 1
          fi

          if [[ "$actual" != "$EXPECTED_VERSION" ]]; then
            echo "VERSION deve corresponder ao horario de criacao do PR: $EXPECTED_VERSION" >&2
            exit 1
          fi
