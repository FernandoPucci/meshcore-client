[package]
name = "meshcore-monitor"
version = "1.0.1"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serialport = { version = "4.10", default-features = false }
ureq = { version = "3.1", features = ["json"] }
urlencoding = "2.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
